[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-system"
version = "0.1.0"
description = "Versioned agent knowledge and review over MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.8,<3", "httpx>=0.27,<1"]

[project.scripts]
memo-system = "memo_system.server:main"

[tool.setuptools.packages.find]
include = ["memo_system*"]
